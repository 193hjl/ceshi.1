<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图书列表</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f6fa; }
    h1 { color: #333; }
    .book { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .title { font-size: 18px; color: #2c3e50; margin-bottom: 6px; }
    .meta { color: #888; font-size: 14px; }
    .price { color: #e74c3c; font-weight: bold; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>图书列表</h1>

  <div class="book">
    <div class="title">Python编程从入门到实践</div>
    <div class="meta">作者：<span class="author">Eric Matthes</span><span class="price">￥89.00</span></div>
  </div>

  <div class="book">
    <div class="title">流畅的Python</div>
    <div class="meta">作者：<span class="author">Luciano Ramalho</span><span class="price">￥139.00</span></div>
  </div>

  <div class="book">
    <div class="title">深入理解计算机系统</div>
    <div class="meta">作者：<span class="author">Randal E. Bryant</span><span class="price">￥139.00</span></div>
  </div>

  <div class="book">
    <div class="title">算法导论</div>
    <div class="meta">作者：<span class="author">Thomas H. Cormen</span><span class="price">￥128.00</span></div>
  </div>
</body>
</html>
